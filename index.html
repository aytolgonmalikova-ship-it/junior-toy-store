<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Junior — яркий магазин детских игрушек: безопасные, развивающие игрушки, конструкторы и подарки с доставкой до двери." />
    <meta name="theme-color" content="#FFD23F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Rubik+Bubbles&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet" />
    <title>Junior — магазин детских игрушек</title>
    <script>
      // Apply the saved theme before React renders to avoid a flash of the wrong theme.
      try {
        if (localStorage.getItem('junior-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
